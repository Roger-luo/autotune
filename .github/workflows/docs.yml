name: Docs

# Deploy the Astro docs site at `docs/` to GitHub Pages via the gh-pages branch.
#
# The repo is a public GitHub *project* page, so the site lives under
# https://roger-luo.github.io/autotune/ (base path `/autotune`).
#
# Behaviour:
# - Push to `main`            → build with AUTOTUNE_BASE=/autotune and publish
#                               to the gh-pages branch root.
# - Pull request (opened /    → build with AUTOTUNE_BASE=/autotune/pr-preview/pr-<N>
#   synchronize / reopened)     and let rossjrw/pr-preview-action publish it to
#                               gh-pages under `pr-preview/pr-<N>/`. Filtered to
#                               PRs that actually touch the site's inputs.
# - Pull request closed       → cleanup-preview removes the `pr-preview/pr-<N>/`
#                               subdirectory.
#
# The API-reference pages are generated from the rustdoc JSON committed under
# `docs/.rustdoc/*.json`, so CI needs no Rust toolchain — just Node + pnpm.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # The site sources (which include the committed rustdoc JSON under
      # docs/.rustdoc/) and this workflow.
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request_target:
    types: [closed]

# No workflow-wide write privileges. Each job declares the narrowest token
# scope it needs: the build job runs repo-controlled JS (the Astro content
# loader) with a read-only token, and only the deploy jobs can push to gh-pages.
permissions:
  contents: read

concurrency:
  # Serialise per-PR (and main); a fresh build cancels any in-flight one for
  # the same ref so PR comments don't pile up on rapid pushes.
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build the static site once, upload it as an artifact, and let the
    # downstream jobs decide where (if anywhere) to publish it.
    if: github.event.action != 'closed'
    name: Build Astro site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.compute-base.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache backend resolves.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs deps
        # --frozen-lockfile asserts the lockfile is in sync; it fails loudly
        # if package.json and pnpm-lock.yaml have drifted.
        run: pnpm install --frozen-lockfile
        working-directory: docs

      - name: Compute base path
        id: compute-base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=/autotune/pr-preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=/autotune" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        working-directory: docs
        env:
          AUTOTUNE_SITE: https://roger-luo.github.io
          AUTOTUNE_BASE: ${{ steps.compute-base.outputs.base }}
        run: pnpm build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-main:
    name: Deploy to gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job writes to gh-pages; it doesn't run any repo-controlled
    # scripts (the artifact is already built).
    permissions:
      contents: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          # Preserve /pr-preview/* (managed by the pr-preview-action below).
          keep_files: true
          commit_message: "docs: deploy ${{ github.sha }}"

  deploy-preview:
    name: Deploy PR preview
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Writes the pre-built artifact to gh-pages/pr-preview/pr-<N>/ and comments
    # the preview URL back on the PR.
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/

      - name: Deploy PR preview to gh-pages/pr-preview/pr-<N>
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    name: Clean up PR preview
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    # Removes the gh-pages/pr-preview/pr-<N>/ subtree and edits the PR's
    # preview comment; nothing else.
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: docs/dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
