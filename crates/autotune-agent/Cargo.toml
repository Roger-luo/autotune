[package]
name = "autotune-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
autotune-config = { path = "../autotune-config" }
dirs = "6"
terminal_size = "0.4"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
